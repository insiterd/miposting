---
name: Build & Push Images

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  POSTIZ_IMAGE: ghcr.io/insiterd/miposting-postiz
  LANDING_IMAGE: ghcr.io/insiterd/miposting-landing

# Encola los deploys en vez de solaparlos: dos pushes seguidos a main competian
# por el mismo docker-compose.yaml y routers.yaml del VPS. No se cancela el que
# esta en curso porque abortar un deploy a medias es peor que esperarlo.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-postiz:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push postiz
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.POSTIZ_IMAGE }}:${{ github.sha }}
            ${{ env.POSTIZ_IMAGE }}:latest
          build-args: |
            NEXT_PUBLIC_VERSION=${{ github.sha }}
          cache-from: type=registry,ref=${{ env.POSTIZ_IMAGE }}:cache
          cache-to: type=registry,ref=${{ env.POSTIZ_IMAGE }}:cache,mode=max

  build-landing:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push landing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: landing/Dockerfile
          push: true
          tags: |
            ${{ env.LANDING_IMAGE }}:${{ github.sha }}
            ${{ env.LANDING_IMAGE }}:latest
          cache-from: type=registry,ref=${{ env.LANDING_IMAGE }}:cache
          cache-to: type=registry,ref=${{ env.LANDING_IMAGE }}:cache,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: [build-postiz, build-landing]
    steps:
      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Pull latest images and restart
        run: |
          ssh dev@${{ secrets.VPS_HOST }} 'bash -s' << 'REMOTE_SCRIPT'
          set -e
          COMPOSE_FILE='/data/coolify/applications/flofb07yh5gfcgxhw0ko0m1j/docker-compose.yaml'
          ROUTERS_FILE='/data/coolify/proxy/dynamic/routers.yaml'

          echo "=== Validando sudo sin contrasena ==="
          # El sudoers de dev@ es por-comando (sed/tee/chmod/docker), no un "ALL"
          # generico: 'sudo -n true' falla siempre porque /usr/bin/true no esta
          # en la lista blanca, aunque el deploy real funcione. Se prueba con uno
          # de los comandos que el script realmente usa, en modo no-mutante.
          sudo -n /usr/bin/sed --version >/dev/null 2>&1 || {
            echo "FATAL: dev@ necesita sudo NOPASSWD para sed/tee/chmod sobre /data/coolify."
            echo "       La sesion SSH no es interactiva, asi que un sudo con password aborta el deploy."
            exit 1
          }

          echo "=== Ensuring group permissions for CI/CD ==="
          sudo chmod g+rx /data/coolify/applications/flofb07yh5gfcgxhw0ko0m1j/

          echo "=== Validando acceso a Docker socket ==="
          docker info > /dev/null 2>&1 || { echo "Error: dev no tiene acceso a Docker socket"; exit 1; }

          # SHA actualmente desplegado, para poder revertir si algun gate falla.
          PREV_SHA=$(grep -oE 'miposting-postiz:[a-zA-Z0-9_.-]+' "$COMPOSE_FILE" | head -1 | cut -d: -f2)
          if [ -z "$PREV_SHA" ] || [ "$PREV_SHA" = "latest" ]; then
            echo "AVISO: no se pudo determinar un SHA previo concreto (leido: '${PREV_SHA:-vacio}')."
            echo "       El rollback automatico quedara deshabilitado en este deploy."
            PREV_SHA=""
          else
            echo "SHA previo desplegado: $PREV_SHA"
          fi

          rollback() {
            if [ -z "$PREV_SHA" ]; then
              echo "!!! Sin SHA previo conocido: NO se revierte. Revisar el VPS a mano."
              return 0
            fi
            echo "!!! Revirtiendo a $PREV_SHA"
            sudo sed -i -E "s|(ghcr.io/insiterd/miposting-postiz):[a-zA-Z0-9_.-]+|\1:$PREV_SHA|g" "$COMPOSE_FILE"
            sudo sed -i -E "s|(ghcr.io/insiterd/miposting-landing):[a-zA-Z0-9_.-]+|\1:$PREV_SHA|g" "$COMPOSE_FILE"
            docker compose -f "$COMPOSE_FILE" up -d --no-deps postiz postiz-landing || true
            echo "!!! Rollback aplicado. Produccion vuelve a $PREV_SHA"
          }

          echo "=== Pinning images to ${{ github.sha }} ==="
          sudo sed -i -E "s|(ghcr.io/insiterd/miposting-postiz):[a-zA-Z0-9_.-]+|\1:${{ github.sha }}|g" "$COMPOSE_FILE"
          sudo sed -i -E "s|(ghcr.io/insiterd/miposting-landing):[a-zA-Z0-9_.-]+|\1:${{ github.sha }}|g" "$COMPOSE_FILE"

          echo "=== Adding certResolver to Docker router labels ==="
          if ! grep -q "traefik.http.routers.postiz.tls.certResolver" "$COMPOSE_FILE"; then
            sudo sed -i '/traefik.http.routers.postiz.tls=true$/a\            - traefik.http.routers.postiz.tls.certResolver=letsencrypt' "$COMPOSE_FILE"
          fi
          if ! grep -q "traefik.http.routers.landing.tls.certResolver" "$COMPOSE_FILE"; then
            sudo sed -i '/traefik.http.routers.landing.tls=true$/a\            - traefik.http.routers.landing.tls.certResolver=letsencrypt' "$COMPOSE_FILE"
          fi

          echo "=== Pulling new images ==="
          docker compose -f "$COMPOSE_FILE" pull postiz postiz-landing

          echo "=== Recreating containers ==="
          docker compose -f "$COMPOSE_FILE" up -d --no-deps postiz postiz-landing

          echo "=== Waiting for containers to be healthy... ==="
          CONTAINERS_HEALTHY=false
          for i in $(seq 1 30); do
            POSTIZ_ID=$(docker ps -q -f "label=com.docker.compose.service=postiz")
            LANDING_ID=$(docker ps -q -f "label=com.docker.compose.service=postiz-landing")
            HEALTH=$(docker inspect --format='{{.State.Health.Status}}' "$POSTIZ_ID" 2>/dev/null || echo "n/a")
            LANDING_HEALTH=$(docker inspect --format='{{.State.Health.Status}}' "$LANDING_ID" 2>/dev/null || echo "n/a")
            echo "  postiz: $HEALTH, landing: $LANDING_HEALTH"
            if [ "$HEALTH" = "healthy" ] && [ "$LANDING_HEALTH" = "healthy" ]; then
              echo "Both containers healthy!"
              CONTAINERS_HEALTHY=true
              break
            fi
            sleep 3
          done
          if [ "$CONTAINERS_HEALTHY" != true ]; then
            echo "ERROR: los contenedores no llegaron a healthy en 90s (postiz: $HEALTH, landing: $LANDING_HEALTH)"
            rollback
            exit 1
          fi

          # El backend NestJS escucha en :3000; :5000 es nginx, que responde aunque
          # NestJS este caido, de ahi que esta sonda antes pasara siempre.
          echo "=== Waiting for NestJS backend to be ready... ==="
          POSTIZ_CONTAINER=$(docker ps -q -f "label=com.docker.compose.service=postiz")
          BACKEND_READY=false
          for i in $(seq 1 12); do
            BACKEND_OK=$(docker exec "$POSTIZ_CONTAINER" bash -c "timeout 3 cat < /dev/null > /dev/tcp/127.0.0.1/3000" 2>/dev/null && echo "ok" || echo "no")
            if [ "$BACKEND_OK" = "ok" ]; then
              echo "Backend ready!"
              BACKEND_READY=true
              break
            fi
            echo "  backend attempt $i/12"
            sleep 5
          done
          if [ "$BACKEND_READY" != true ]; then
            echo "ERROR: NestJS no escucha en :3000 tras 60s"
            rollback
            exit 1
          fi

          echo "=== Verifying routers.yaml integrity ==="
          cat << 'YAML' | sudo tee "$ROUTERS_FILE" > /dev/null
          http:
            routers:
              postiz-app:
                rule: "Host(`app.miposting.com`)"
                entryPoints:
                  - https
                service: postiz-app
                tls:
                  certResolver: letsencrypt
                priority: 101
                middlewares:
                  - gzip
              landing-web:
                rule: "Host(`miposting.com`)"
                entryPoints:
                  - https
                service: landing-web
                tls:
                  certResolver: letsencrypt
                priority: 101
                middlewares:
                  - gzip
              coolify-web:
                rule: "Host(`coolify.insiterd.com`)"
                entryPoints:
                  - https
                service: coolify-web
                tls:
                  certResolver: letsencrypt
                priority: 101
                middlewares:
                  - gzip
            services:
              postiz-app:
                loadBalancer:
                  servers:
                    - url: "http://postiz:5000"
                  passHostHeader: true
              landing-web:
                loadBalancer:
                  servers:
                    - url: "http://postiz-landing:80"
                  passHostHeader: true
              coolify-web:
                loadBalancer:
                  servers:
                    - url: "http://coolify:8080"
                  passHostHeader: true
            middlewares:
              gzip:
                compress: {}
          YAML

          echo "=== Validando sintaxis YAML ==="
          sudo sed -n "p" "$ROUTERS_FILE" | python3 -c "import yaml,sys; yaml.safe_load(sys.stdin)" || { echo "FATAL: routers.yaml invalido — abortando"; exit 1; }
          echo "YAML OK"

          echo "=== Refreshing Traefik routes ==="
          docker restart coolify-proxy || true
          sleep 5

          echo "=== Verifying endpoints (with retries) ==="
          for i in $(seq 1 12); do
            API_OK=false
            LANDING_OK=false
            FRONTEND_OK=false
            COOLIFY_OK=false

            # /api/health lo sintetiza nginx con un 200 fijo, asi que no prueba nada.
            # /api/ sale del prefijo en nginx y llega al RootController de NestJS,
            # que responde "App is running!": valida Traefik -> nginx -> backend.
            curl -sf --max-time 10 "https://app.miposting.com/api/" 2>/dev/null | grep -q "App is running!" && API_OK=true
            curl -sf -o /dev/null --max-time 15 "https://miposting.com/" && LANDING_OK=true
            curl -sf -o /dev/null --max-time 10 "https://app.miposting.com/auth" && FRONTEND_OK=true
            # -k solo aqui: Coolify es infra ajena a la app y no bloquea el deploy.
            curl -sfk -o /dev/null --max-time 10 "https://coolify.insiterd.com/login" && COOLIFY_OK=true

            if [ "$API_OK" = true ] && [ "$LANDING_OK" = true ] && [ "$FRONTEND_OK" = true ]; then
              echo "All core endpoints verified on attempt $i (Coolify status: $COOLIFY_OK)"
              break
            fi

            echo "Attempt $i failed (API:$API_OK, Landing:$LANDING_OK, Frontend:$FRONTEND_OK, Coolify:$COOLIFY_OK), retrying in 5s..."
            sleep 5

            if [ "$i" = "12" ]; then
              echo "ERROR: Endpoints failed after $i attempts"
              rollback
              exit 1
            fi
          done

          echo "=== Deploy complete ==="
          REMOTE_SCRIPT
